# CI Release — Automated version management via release-please.
# When a release is created, publishes the package to npm under the
# `next` dist-tag, verifies the published artifact installs and registers,
# and only then promotes `latest`. Events from the default GITHUB_TOKEN do
# not cascade to other workflows, so publish runs as a dependent job here
# instead of relying on a separate release-triggered workflow.
name: CI Release

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0

  publish:
    name: Publish to npm
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm trusted publishing (OIDC). No NPM_TOKEN is used.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: "1.4.2"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      # Trusted publishing needs npm >= 11.5.1; dist-tag OIDC needs >= 11.21.
      - name: Use npm with OIDC support
        run: npm install --global npm@^11.21.0
      - run: bun install --frozen-lockfile
      - run: make build

      # Capture the pre-publish `latest` so the promotion step can prove the
      # publish itself did not move it.
      - name: Record current latest dist-tag
        id: latest_before
        run: |
          CURRENT="$(npm view "@mburghardt/opencode-metrics" dist-tags.latest 2>/dev/null || true)"
          echo "current=${CURRENT}" >> "$GITHUB_OUTPUT"
          echo "latest before publish: ${CURRENT:-<none>}"

      # Authentication comes from the GitHub OIDC token configured as a
      # trusted publisher on npmjs.com for this repository and workflow.
      - name: Publish under the next dist-tag
        run: npm publish --access public --tag next

      - name: Verify publish
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          VERSION="${TAG#v}"
          MAX_ATTEMPTS=20
          INTERVAL=15
          for i in $(seq 1 "$MAX_ATTEMPTS"); do
            sleep "$INTERVAL"
            if npm view "@mburghardt/opencode-metrics@${VERSION}" version 2>/dev/null; then
              echo "Package @mburghardt/opencode-metrics@${VERSION} verified on registry"
              exit 0
            fi
            echo "Attempt ${i}/${MAX_ATTEMPTS}: registry not yet propagated, retrying in ${INTERVAL}s..."
          done
          echo "Package not visible after ${MAX_ATTEMPTS} attempts ($((MAX_ATTEMPTS * INTERVAL))s)"
          exit 1

      # Blocking gate: installs the published tarball in a clean project and
      # proves it resolves @opencode/plugin and registers via Plugin.define.
      - name: Verify published artifact
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: bash scripts/verify-published-artifact.sh "${TAG#v}"

      - name: Assert latest is unchanged before promotion
        env:
          EXPECTED: ${{ steps.latest_before.outputs.current }}
        run: |
          ACTUAL="$(npm view "@mburghardt/opencode-metrics" dist-tags.latest 2>/dev/null || true)"
          if [ "${ACTUAL}" != "${EXPECTED}" ]; then
            echo "::error::latest moved before promotion: expected '${EXPECTED}', got '${ACTUAL}'"
            exit 1
          fi
          echo "latest is unchanged (${ACTUAL:-<none>})"

      # Requires "Allow npm dist-tag" on the trusted publisher configuration.
      - name: Promote latest
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: npm dist-tag add "@mburghardt/opencode-metrics@${TAG#v}" latest
