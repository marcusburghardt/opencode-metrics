# CI Checks — Lint, test, and build on every PR and push to main.
name: CI Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: make lint

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: bun test --coverage --coverage-reporter=lcov --coverage-dir=coverage
      - run: bun run scripts/coverage-gate.ts coverage/lcov.info

  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: make build
      - name: Assert runtime dependencies are not bundled
        run: |
          set -eu
          bundle=dist/index.js
          if grep -qE 'node_modules/@opencode/(plugin|schema)' "$bundle"; then
            echo "error: @opencode package sources were bundled into $bundle" >&2
            exit 1
          fi
          if grep -qE 'from "effect"|from "effect/' "$bundle"; then
            echo "error: effect was bundled into $bundle" >&2
            exit 1
          fi
          # @opencode/plugin must remain a single external import.
          imports=$(grep -c 'from "@opencode/plugin"' "$bundle" || true)
          if [ "$imports" -ne 1 ]; then
            echo "error: expected exactly one external @opencode/plugin import, found $imports" >&2
            exit 1
          fi
